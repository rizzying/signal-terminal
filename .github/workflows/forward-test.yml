# Hourly forward test: nine locked paper scorecards (15m / 1H / 4H × zones 1–3) plus the legacy snapshot resolver.
# Read-only market data, no trading. GitHub may delay or skip a run. The job replays every closed candle since each book's cursor
# (a normal hour is four 15m bars). A week of downtime finishes in one run; a longer gap continues next hour and is not skipped.
name: forward-test
on:
  schedule:
    - cron: "7 * * * *"   # 7 minutes past every hour (after the 1H/4H close)
  workflow_dispatch: {}
concurrency: { group: forward-test, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/forward.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
